server:
  port: 8080

spring:
  application:
    name: error-free-text
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:error_free_text}
    username: ${DB_USER:errorfreetext}
    password: ${DB_PASSWORD:errorfreetext}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  scheduler:
    fixed-delay: ${SCHEDULER_DELAY:5000}
  speller:
    url: https://speller.yandex.net/services/spellservice.json/checkTexts
    connect-timeout-ms: 5000
    read-timeout-ms: 15000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
