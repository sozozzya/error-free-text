services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: error_free_text
      POSTGRES_USER: errorfreetext
      POSTGRES_PASSWORD: errorfreetext
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U errorfreetext -d error_free_text"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  error-free-text-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: error_free_text
      DB_USER: errorfreetext
      DB_PASSWORD: errorfreetext
      SCHEDULER_DELAY: 5000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
